id: cors-origin-reflection
info:
  name: CORS Origin Reflection with Credentials
  author: hydra
  severity: medium
  description: >-
    The server reflects an arbitrary Origin in Access-Control-Allow-Origin while
    also allowing credentials, letting a malicious origin read authenticated
    responses.
  remediation: >-
    Allow-list trusted origins explicitly; never reflect the Origin header when
    Access-Control-Allow-Credentials is true.
  tags:
    - cors
    - misconfig
  cwe: CWE-942
requests:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Origin: https://evil.example
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "access-control-allow-origin: https://evil.example"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "access-control-allow-credentials: true"
        case-insensitive: true
