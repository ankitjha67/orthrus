id: sql-dump-exposure
info:
  name: Exposed SQL Database Dump
  author: orthrus
  severity: high
  description: >-
    A SQL database dump/backup is publicly downloadable. These commonly contain
    full table contents - user records, password hashes, and secrets - and the
    schema needed to attack the live database.
  remediation: >-
    Remove backups from the web root, store them outside any served directory,
    and deny access to .sql/.dump artifacts at the web server. Rotate any
    exposed credentials.
  tags:
    - exposure
    - backup
    - database
  cwe: CWE-538
requests:
  - method: GET
    path:
      - "{{BaseURL}}/backup.sql"
      - "{{BaseURL}}/dump.sql"
      - "{{BaseURL}}/database.sql"
      - "{{BaseURL}}/db.sql"
      - "{{BaseURL}}/backup/database.sql"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        condition: or
        regex:
          - "-- MySQL dump"
          - "PostgreSQL database dump"
          - "CREATE TABLE"
          - "INSERT INTO `"
