# ORTHRUS distributed stack (PRD §15.2). Authorized testing only.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml run --rm app scan -t https://example.com
#
# `worker` runs Celery workers (scale with --scale worker=N); targets dispatched
# via `orthrus scan --distributed -t targets.txt` land on them through Redis and
# write to the shared Postgres database.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orthrus
      POSTGRES_USER: orthrus
      POSTGRES_PASSWORD: orthrus
    volumes:
      - orthrus-pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on: [redis, postgres]
    environment: &orthrus-env
      ORTHRUS_DB_URL: postgresql+asyncpg://orthrus:orthrus@postgres:5432/orthrus
      ORTHRUS_REDIS_URL: redis://redis:6379/0
      ORTHRUS_DATA_DIR: /data
    volumes:
      - orthrus-data:/data
    # CLI-driven: `docker compose run --rm app scan ...`

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on: [redis, postgres]
    environment: *orthrus-env
    volumes:
      - orthrus-data:/data
    entrypoint: ["celery", "-A", "orthrus.distributed.celery_app", "worker", "--loglevel=info"]

  # OOB callbacks across distributed workers need a SHARED, externally-reachable
  # callback server. The in-process LocalCallbackServer only serves same-host
  # targets; for distributed engagements run Interactsh and point modules at it
  # (future integration). Example:
  # callback:
  #   image: projectdiscovery/interactsh-server:latest
  #   ports: ["53:53/udp", "80:80", "443:443"]

volumes:
  orthrus-pgdata:
  orthrus-data:
