[package]
name = "orthrus-cockpit"
version = "2.0.0"
description = "ORTHRUS v2.0 operator cockpit"
authors = ["Ankit Jha"]
edition = "2021"

[lib]
name = "orthrus_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
