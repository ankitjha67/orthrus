[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydra-framework"
version = "0.1.0"
description = "Automated vulnerability discovery & exploitation confirmation framework (authorized security testing only)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ankit Jha" }]
license = { text = "MIT" }
keywords = ["security", "pentest", "vulnerability-scanner", "appsec"]

# Lean core: pure-Python / wheel-available deps that install cleanly on Windows + 3.14.
# Heavier integrations (Playwright, Nmap, Interactsh, Celery/Redis, Postgres, sslyze,
# pyjwt, paramiko, weasyprint) are deferred to optional extras below and added per roadmap phase.
dependencies = [
    "httpx>=0.27",
    "h2>=4.1",
    "click>=8.1",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "dnspython>=2.6",
    "aiofiles>=23.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
scanners = ["pyjwt>=2.8", "cryptography>=42.0", "sslyze>=6.0", "paramiko>=3.4", "websockets>=12.0"]
recon = ["python-nmap>=0.7"]
reporting = ["weasyprint>=62.0"]  # optional alt PDF backend; default PDF uses [browser] Chromium
distributed = ["celery>=5.4", "redis>=5.0"]
postgres = ["asyncpg>=0.29", "alembic>=1.13"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hydra = "hydra.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["hydra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B027: empty non-abstract methods in an ABC are intentional optional lifecycle
# hooks (BaseScanner.setup/teardown); E501: line length handled by formatter.
ignore = ["E501", "B027"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
